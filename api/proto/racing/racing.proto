syntax = "proto3";
package racing;

option go_package = "/racing";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service Racing {
  // ListRaces returns a list of all races.
  rpc ListRaces(ListRacesRequest) returns (ListRacesResponse) {
    option (google.api.http) = { post: "/v1/list-races", body: "*" };
  }

  // GetRace returns a single race by its id. It returns NOT_FOUND if there
  // is no race with that id, and INVALID_ARGUMENT if id is zero or negative.
  rpc GetRace(GetRaceRequest) returns (Race) {
    option (google.api.http) = { get: "/v1/races/{id}" };
  }
}

/* Requests/Responses */

// Request for ListRaces call.
message ListRacesRequest {
  ListRacesRequestFilter filter = 1;
  // order_by sorts the results, e.g. "meeting_id, advertised_start_time desc".
  // When empty, races are ordered by advertised_start_time, earliest first.
  // Races are always ordered by id last, so the order is stable when other
  // values are equal. An unknown field or direction returns INVALID_ARGUMENT
  // rather than being ignored.
  string order_by = 2;
}

// Response to ListRaces call.
message ListRacesResponse {
  repeated Race races = 1;
}

// Filter for listing races.
message ListRacesRequestFilter {
  repeated int64 meeting_ids = 1;
  // only_visible, when true, returns only races marked as visible.
  // When omitted or false, races are returned regardless of visibility,
  // so existing callers keep getting all races.
  //
  // Named only_visible rather than visible: a plain proto3 bool cannot
  // tell "not set" apart from false, so a field called visible would be
  // ambiguous about whether false means "all races" or "hidden races only".
  bool only_visible = 2;
}

// Request for GetRace call.
message GetRaceRequest {
  // id of the race to return.
  int64 id = 1;
}

/* Resources */

// A race resource.
message Race {
  // ID represents a unique identifier for the race.
  int64 id = 1;
  // MeetingID represents a unique identifier for the races meeting.
  int64 meeting_id = 2;
  // Name is the official name given to the race.
  string name = 3;
  // Number represents the number of the race.
  int64 number = 4;
  // Visible represents whether or not the race is visible.
  bool visible = 5;
  // AdvertisedStartTime is the time the race is advertised to run.
  google.protobuf.Timestamp advertised_start_time = 6;

  // Status says whether a race is still open.
  enum Status {
    // Not used in responses: every race is returned as OPEN or CLOSED.
    STATUS_UNSPECIFIED = 0;
    // advertised_start_time is now or in the future.
    OPEN = 1;
    // advertised_start_time is in the past.
    CLOSED = 2;
  }
  // Output only. Worked out from advertised_start_time on each request,
  // not stored.
  Status status = 7;
}
